services:
  firebase-emulator:
    build:
      context: ./backend/docker/firebase-emulator
      dockerfile: Dockerfile
    container_name: selpe-firebase-emulator
    ports:
      - "${EMULATOR_UI_PORT:-4005}:4000"
      - "${FIRESTORE_PORT:-8085}:8080"
      - "${AUTH_PORT:-9095}:9099"
      - "${STORAGE_PORT:-9195}:9199"
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - selpe-network

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    container_name: selpe-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-3333}:3333"
    environment:
      - NODE_ENV=development
      - PORT=3333
      - HOST=0.0.0.0
      - TZ=America/Sao_Paulo
      - JWT_SECRET=${JWT_SECRET:-selpe-secret-key-dev-super-secure-change-in-prod}
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase-emulator:9199
      - FIREBASE_STORAGE_BUCKET=selpe-peruibe-dev.appspot.com
      - FIREBASE_PROJECT_ID=selpe-peruibe-dev
    volumes:
      - ./backend:/app:z
      - /app/node_modules
    depends_on:
      - firebase-emulator
    networks:
      - selpe-network

networks:
  selpe-network:
    driver: bridge
